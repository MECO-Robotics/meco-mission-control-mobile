name: Check shared skills

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - development
      - staging
      - "staging/**"
      - main

permissions:
  contents: read

jobs:
  check-skills:
    runs-on: ubuntu-latest
    env:
      SKILLS_REPO: ${{ vars.SKILLS_REPO || 'https://github.com/MECO-Robotics/mission-control-skills.git' }}
      SKILLS_REF: ${{ vars.SKILLS_REF || 'main' }}
      SYNC_MISSING_SKILLS: "true"
    steps:
      - name: Check out repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Import shared skills
        shell: bash
        run: bash scripts/check-skills-current.sh

name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Optional release-* source tag already contained in protected main
        required: false
        type: string
      release_tag:
        description: Optional release-* tag for the GitHub release
        required: false
        type: string
      release_name:
        description: Optional single-line release title
        required: false
        type: string
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
          - development
      draft:
        description: Create as draft release
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

jobs:
  prepare:
    name: Validate protected release source
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      build_profile: ${{ steps.target.outputs.build_profile }}
    steps:
      - name: Checkout protected main for source validation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve trusted target commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          SOURCE_TAG: ${{ inputs.source_tag || '' }}
          BUILD_PROFILE: ${{ inputs.profile || 'production' }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin refs/heads/main:refs/remotes/origin/main

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WORKFLOW_RUN_BRANCH" != "main" ]]; then
              echo "Automated releases are allowed only after CI on main." >&2
              exit 1
            fi
            TARGET_SHA="$WORKFLOW_RUN_SHA"
          else
            if [[ "$EVENT_REF" != "refs/heads/main" ]]; then
              echo "Manual releases must run from the protected main workflow." >&2
              exit 1
            fi

            if [[ -n "$SOURCE_TAG" ]]; then
              if [[ ! "$SOURCE_TAG" =~ ^release-[A-Za-z0-9._-]+$ ]]; then
                echo "source_tag must match ^release-[A-Za-z0-9._-]+$." >&2
                exit 1
              fi
              TARGET_SHA="$(git rev-parse --verify "refs/tags/${SOURCE_TAG}^{commit}")"
            else
              TARGET_SHA="$EVENT_SHA"
            fi
          fi

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved release target is not a full commit SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/main; then
            echo "Release target must be contained in protected main." >&2
            exit 1
          fi
          if [[ ! "$BUILD_PROFILE" =~ ^(production|preview|development)$ ]]; then
            echo "Unsupported EAS build profile." >&2
            exit 1
          fi

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "build_profile=$BUILD_PROFILE" >> "$GITHUB_OUTPUT"
          echo "Release source accepted: $TARGET_SHA (contained in main)."

  build:
    name: Approved EAS build
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout validated release target
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies before exposing release credentials
        run: npm ci

      - name: Validate app identifiers
        run: |
          node <<'NODE'
          const app = require('./app.json')?.expo ?? {};
          const missing = [];
          if (!app?.ios?.bundleIdentifier) missing.push('expo.ios.bundleIdentifier');
          if (!app?.android?.package) missing.push('expo.android.package');
          if (missing.length > 0) {
            throw new Error(`Missing required app identifiers: ${missing.join(', ')}`);
          }
          NODE

      - name: Validate release credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "EXPO_TOKEN is required for approved EAS builds." >&2
            exit 1
          fi
          if [[ ! "$EXPO_PUBLIC_API_BASE_URL" =~ ^https:// ]]; then
            echo "EXPO_PUBLIC_API_BASE_URL must be an HTTPS production URL." >&2
            exit 1
          fi

      - name: Install pinned EAS CLI before exposing release credentials
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8.2.1
        with:
          eas-version: 21.7.1

      - name: Sync EAS public API URL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail
          for EAS_ENV in production preview development; do
            eas env:create "$EAS_ENV" \
              --name EXPO_PUBLIC_API_BASE_URL \
              --value "$EXPO_PUBLIC_API_BASE_URL" \
              --visibility sensitive \
              --scope project \
              --force \
              --non-interactive
          done

      - name: Build iOS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_PROFILE: ${{ needs.prepare.outputs.build_profile }}
        run: eas build --platform ios --profile "$BUILD_PROFILE" --non-interactive --wait --json > ios-build.json

      - name: Build Android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_PROFILE: ${{ needs.prepare.outputs.build_profile }}
        run: eas build --platform android --profile "$BUILD_PROFILE" --non-interactive --wait --json > android-build.json

      - name: Extract build artifact metadata
        id: builds
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function readBuild(platform) {
            const raw = JSON.parse(fs.readFileSync(`${platform}-build.json`, 'utf8'));
            const build = Array.isArray(raw) ? raw[0] : raw;
            const url = build?.artifacts?.applicationArchiveUrl;
            if (!url || new URL(url).protocol !== 'https:') {
              throw new Error(`Missing secure ${platform} application archive URL.`);
            }
            const filename = path.basename(new URL(url).pathname);
            if (!/^[A-Za-z0-9._-]+$/.test(filename)) {
              throw new Error(`Unsafe ${platform} artifact filename.`);
            }
            return { id: String(build?.id ?? ''), url, filename };
          }

          const ios = readBuild('ios');
          const android = readBuild('android');
          for (const [key, value] of Object.entries({
            ios_url: ios.url,
            ios_filename: ios.filename,
            android_url: android.url,
            android_filename: android.filename,
          })) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          fs.writeFileSync('build-metadata.json', `${JSON.stringify({ ios, android }, null, 2)}\n`);
          NODE

      - name: Download build artifacts
        env:
          IOS_URL: ${{ steps.builds.outputs.ios_url }}
          IOS_FILENAME: ${{ steps.builds.outputs.ios_filename }}
          ANDROID_URL: ${{ steps.builds.outputs.android_url }}
          ANDROID_FILENAME: ${{ steps.builds.outputs.android_filename }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          curl --fail --location --proto '=https' "$IOS_URL" --output "release-artifacts/$IOS_FILENAME"
          curl --fail --location --proto '=https' "$ANDROID_URL" --output "release-artifacts/$ANDROID_FILENAME"

      - name: Resolve validated release metadata
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          BUILD_PROFILE: ${{ needs.prepare.outputs.build_profile }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name || '' }}
          INPUT_DRAFT: ${{ inputs.draft || false }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const app = require('./app.json');
          const pkg = require('./package.json');
          const builds = require('./build-metadata.json');
          const version = app?.expo?.version || pkg.version || '0.0.0';
          const shortSha = process.env.TARGET_SHA.slice(0, 7);
          const tag = process.env.INPUT_RELEASE_TAG || `release-${version}-${shortSha}`;
          const name = process.env.INPUT_RELEASE_NAME || `MECO Mission Control Mobile ${version} (${shortSha})`;

          if (!/^release-[A-Za-z0-9._-]+$/.test(tag)) {
            throw new Error('release_tag must match ^release-[A-Za-z0-9._-]+$.');
          }
          if (!name || name.length > 120 || /[\x00-\x1f\x7f]/.test(name)) {
            throw new Error('release_name must be a non-empty single line of at most 120 characters.');
          }

          const metadata = {
            tag,
            name,
            targetSha: process.env.TARGET_SHA,
            draft: process.env.INPUT_DRAFT === 'true',
          };
          fs.writeFileSync('release-metadata.json', `${JSON.stringify(metadata, null, 2)}\n`);
          fs.writeFileSync(
            'release-body.md',
            [
              `EAS build profile: \`${process.env.BUILD_PROFILE}\``,
              `iOS build ID: \`${builds.ios.id}\``,
              `Android build ID: \`${builds.android.id}\``,
              '',
            ].join('\n'),
          );
          NODE

      - name: Upload approved release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-mobile-release-${{ needs.prepare.outputs.target_sha }}
          path: |
            release-artifacts/*
            release-metadata.json
            release-body.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Approved GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download approved release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: approved-mobile-release-${{ needs.prepare.outputs.target_sha }}

      - name: Load validated release metadata
        id: release
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const metadata = require('./release-metadata.json');
          if (!/^release-[A-Za-z0-9._-]+$/.test(metadata.tag)) throw new Error('Invalid release tag.');
          if (!/^[0-9a-f]{40}$/.test(metadata.targetSha)) throw new Error('Invalid target SHA.');
          if (!metadata.name || metadata.name.length > 120 || /[\x00-\x1f\x7f]/.test(metadata.name)) {
            throw new Error('Invalid release name.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${metadata.tag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${metadata.name}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `target_sha=${metadata.targetSha}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `draft=${metadata.draft}\n`);
          NODE

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ steps.release.outputs.target_sha }}
          draft: ${{ steps.release.outputs.draft }}
          generate_release_notes: true
          body_path: release-body.md
          files: release-artifacts/*
